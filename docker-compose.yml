services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:8081

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - backend